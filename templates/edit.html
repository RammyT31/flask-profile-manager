{% extends "base.html" %}
{% block title %}Update profile | Profile Manager{% endblock %}
{% block content %}
<section class="form-card">
    <h1>Update profile</h1>
    <p>Change the details below and save your updates.</p>
    <form method="post" action="{{ url_for('edit_profile', profile_id=profile.id) }}">
        <label for="full_name">Full name</label>
        <input id="full_name" name="full_name" type="text" required minlength="2"
               value="{{ profile.full_name }}">

        <label for="email">Email address</label>
        <input id="email" name="email" type="email" required value="{{ profile.email }}">

        <label for="phone">Phone number</label>
        <input id="phone" name="phone" type="tel" required value="{{ profile.phone }}">

        <label for="date_of_birth">Date of birth</label>
        <input id="date_of_birth" name="date_of_birth" type="date" required
               value="{{ profile.date_of_birth }}">

        <button class="button" type="submit">Save changes</button>
        <a class="cancel-link" href="{{ url_for('view_profile', profile_id=profile.id) }}">Cancel</a>
    </form>
</section>
{% endblock %}
